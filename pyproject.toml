[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-ai-radar"
version = "0.3.0"
description = "Discover unsanctioned AI usage and sensitive-data leakage from egress logs"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []  # stdlib only

[project.scripts]
radar = "radar.__main__:main"

[tool.setuptools]
packages = ["radar"]
